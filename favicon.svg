<!-- The tab mark. Same drawing as the masthead mark in index.html: six
     data points in a ring, one of them not filled in. Here it sits on the
     header's navy so it stays visible on a dark tab bar as well as a
     light one; in the masthead the bar supplies that navy already. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <rect width="24" height="24" rx="5" fill="#13355C"/>
  <g fill="#C9D8E6">
    <circle cx="18.24" cy="8.4" r="2.2"/>
    <circle cx="18.24" cy="15.6" r="2.2"/>
    <circle cx="12" cy="19.2" r="2.2"/>
    <circle cx="5.76" cy="15.6" r="2.2"/>
    <circle cx="5.76" cy="8.4" r="2.2"/>
  </g>
  <circle cx="12" cy="4.8" r="2" fill="none" stroke="#FFFFFF" stroke-width="1.1"/>
</svg>
